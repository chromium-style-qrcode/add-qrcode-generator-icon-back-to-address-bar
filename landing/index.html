<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator — Add QR Code Generator Icon Back To Address Bar</title>
    <meta
      name="description"
      content="A Chrome extension that brings back the Chromium-style QR code generator with the Chrome dinosaur, SVG export, batch generation, and more."
    />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0; line-height: 1.6; background: #fff; color: #1a1a1a;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 72px 20px; text-align: center; }
      h1 { font-size: 32px; margin: 0 0 12px; letter-spacing: -0.02em; }
      p { color: #555; font-size: 17px; margin: 0 auto 28px; max-width: 520px; }
      .cta {
        display: inline-block; margin: 6px; padding: 13px 24px; border-radius: 10px;
        font-weight: 600; font-size: 16px; text-decoration: none;
      }
      .cta.primary { background: #1a73e8; color: #fff; }
      .cta.secondary { background: #f0f0f0; color: #333; border: 1px solid #ddd; }
      footer { margin-top: 64px; color: #888; font-size: 13px; }
      footer a { color: #888; }
      @media (prefers-color-scheme: dark) {
        body { background: #111; color: #eaeaea; }
        p { color: #bbb; }
        .cta.secondary { background: #1c1c1c; color: #ddd; border-color: #333; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>QR Code Generator</h1>
      <p>
        Bring back the Chromium-style QR code generator to your address bar — with
        the Chrome dinosaur, SVG export, batch generation, and more.
      </p>
      <a
        class="cta primary"
        href="https://chromewebstore.google.com/detail/add-qr-code-generator-ico/kacblhilkacgfnkjfodalohcnllcgmjd"
      >
        Add to Chrome
      </a>
      <a class="cta secondary" href="/pricing.html">See pricing</a>
      <footer>
        <p><a href="/pricing.html">Pricing</a> · <a href="/activate.html">Activate</a></p>
      </footer>
    </div>
  </body>
</html>
